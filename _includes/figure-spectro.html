<div class="wave">
  <canvas id="wave" aria-hidden="true"></canvas>
  <div class="wave-legend">
    <span>Spectro-temporal surface &middot; formant transition</span>
    <span>frequency &rarr; &middot; time &nearr; &middot; intensity &uarr;</span>
  </div>
</div>

<script>
(function () {
  var canvas = document.getElementById("wave");
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext("2d");

  var SLICES = 46; /* spectral frames stacked through time */
  var POINTS = 150; /* frequency bins per frame */
  var FMAX   = 5000; /* Hz */
  var DUR    = 2.4; /* s */

  /* A vowel-to-vowel transition: formants glide, as they do in running speech. */
  function formants(u) {
    var ease = u * u * (3 - 2 * u);
    return [
      { f: 620 + (330 - 620) * ease,   b: 70,  a: 1.00 },
      { f: 1180 + (2180 - 1180) * ease, b: 105, a: 0.72 },
      { f: 2500 + (2820 - 2500) * ease, b: 150, a: 0.42 },
      { f: 3550,                        b: 200, a: 0.20 }
    ];
  }

  /* Spectral envelope in dB: resonances over a -6 dB/octave source tilt. */
  function levelAt(hz, u) {
    var F = formants(u), m = 0;
    for (var i = 0; i < F.length; i++) {
      var d = (hz - F[i].f) / F[i].b;
      m += F[i].a / (1 + d * d);
    }
    m *= 1 / (1 + hz / 900); /* source spectral tilt */
    var db = 20 * Math.log10(m + 1e-4);
    return Math.max(0, Math.min(1, (db + 58) / 58)); /* normalise to 0..1 */
  }

  function draw() {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var cs = getComputedStyle(document.documentElement);
    var accent = (cs.getPropertyValue("--accent") || "").trim() || "#0f6b63";
    var ink    = (cs.getPropertyValue("--ink")    || "").trim() || "#14181a";
    var rule   = (cs.getPropertyValue("--rule")   || "").trim() || "#dbded9";
    var faint  = (cs.getPropertyValue("--faint")  || "").trim() || "#8a938f";
    var paper  = (cs.getPropertyValue("--paper")  || "").trim() || "#f4f5f3";

    var padL = w * 0.085, padR = w * 0.03;
    var FX = (w - padL - padR) * 0.74; /* frequency axis length */
    var DX = (w - padL - padR) * 0.26; /* time axis, receding right */
    var DY = h * 0.30; /* time axis, receding up */
    var AY = h * 0.40; /* intensity */
    var ox = padL, oy = h * 0.86;

    function P(fn, tn, a) {
      return [ox + fn * FX + tn * DX, oy - tn * DY - a * AY];
    }

    /* ---- base plane */
    ctx.beginPath();
    var c0 = P(0, 0, 0), c1 = P(1, 0, 0), c2 = P(1, 1, 0), c3 = P(0, 1, 0);
    ctx.moveTo(c0[0], c0[1]); ctx.lineTo(c1[0], c1[1]);
    ctx.lineTo(c2[0], c2[1]); ctx.lineTo(c3[0], c3[1]);
    ctx.closePath();
    ctx.strokeStyle = rule; ctx.lineWidth = 1; ctx.stroke();

    /* intensity axis with dB ticks */
    ctx.strokeStyle = rule;
    ctx.beginPath();
    var a0 = P(0, 1, 0), a1 = P(0, 1, 1);
    ctx.moveTo(a0[0], a0[1]); ctx.lineTo(a1[0], a1[1]);
    ctx.stroke();

    ctx.fillStyle = faint;
    ctx.font = '500 9px "IBM Plex Mono", ui-monospace, monospace';
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    [[0, "-60"], [0.5, "-30"], [1, "0"]].forEach(function (tick) {
      var p = P(0, 1, tick[0]);
      ctx.beginPath();
      ctx.moveTo(p[0] - 4, p[1]); ctx.lineTo(p[0], p[1]);
      ctx.strokeStyle = rule; ctx.stroke();
      ctx.fillText(tick[1], p[0] - 6, p[1]);
    });

    /* frequency ticks along the front edge */
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    [[0, "0"], [0.2, "1k"], [0.4, "2k"], [0.6, "3k"], [0.8, "4k"], [1, "5k"]].forEach(function (tick) {
      var p = P(tick[0], 0, 0);
      ctx.beginPath();
      ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0], p[1] + 4);
      ctx.strokeStyle = rule; ctx.stroke();
      ctx.fillText(tick[1], p[0], p[1] + 6);
    });

    /* ---- waterfall: back to front, each frame occluding the last */
    for (var s = SLICES - 1; s >= 0; s--) {
      var tn = s / (SLICES - 1);
      var u = tn;
      ctx.beginPath();
      for (var i = 0; i <= POINTS; i++) {
        var fn = i / POINTS;
        var p = P(fn, tn, levelAt(fn * FMAX, u));
        if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
      }
      /* close down to the base so the fill hides frames behind it */
      var end = P(1, tn, 0), start = P(0, tn, 0);
      ctx.lineTo(end[0], end[1]);
      ctx.lineTo(start[0], start[1]);
      ctx.closePath();

      ctx.fillStyle = paper;
      ctx.globalAlpha = 0.92;
      ctx.fill();

      ctx.globalAlpha = 0.30 + 0.55 * (1 - tn);
      ctx.strokeStyle = (s % 8 === 0) ? ink : accent;
      ctx.lineWidth = (s % 8 === 0) ? 1.3 : 0.9;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* ---- axis labels */
    ctx.fillStyle = faint;
    ctx.font = '500 9px "IBM Plex Mono", ui-monospace, monospace';
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    var flab = P(0.5, 0, 0);
    ctx.fillText("FREQUENCY (Hz)", flab[0], flab[1] + 18);

    ctx.save();
    var tlab = P(1, 0.5, 0);
    ctx.translate(tlab[0] + 16, tlab[1] - 6);
    ctx.rotate(Math.atan2(-DY, DX));
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText("TIME (0–" + DUR.toFixed(1) + " s)", 0, 0);
    ctx.restore();

    ctx.save();
    var ilab = P(0, 1, 0.5);
    ctx.translate(ilab[0] - 26, ilab[1]);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText("INTENSITY (dB)", 0, 0);
    ctx.restore();
  }

  draw();
  var timer;
  window.addEventListener("resize", function () {
    clearTimeout(timer);
    timer = setTimeout(draw, 120);
  });
  if (window.MutationObserver) {
    new MutationObserver(draw).observe(document.documentElement, {
      attributes: true, attributeFilter: ["data-theme"]
    });
  }
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", function () { setTimeout(draw, 40); });
  }
})();
</script>
